<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compose Web Components</title>
    <script src="compose-web-components.js" defer></script>
</head>
<body>
    <my-web-component counter="5"></my-web-component>
<script>
    let i = 0;
    setInterval(() => {
        const el = document.querySelector('my-web-component')
        el.setAttribute("counter", ++i);
    }, 1000)
</script>
</body>
</html>
